<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nebulapunk — Mesh Terrain — Screen</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#060310; overflow:hidden; }
.card { position:relative; width:100%; height:100%; background:#060310; cursor:none; overflow:hidden; }
canvas { position:absolute; inset:0; pointer-events:none; }
/* ===== Screen FX (same treatment as the intro starfield) =====
   Scan lines + slow roll, chromatic aberration around the cursor, glass glare,
   smudges and light-reactive scratches. All layers ignore the mouse. */
.fx-layer { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
#fx-ca      { z-index:1; mix-blend-mode:screen; }
.fx-scan    { z-index:2; background:repeating-linear-gradient(to bottom, rgba(0,0,0,.38) 0 1px, transparent 1px 3px); }
.fx-roll    { z-index:2; mix-blend-mode:color-dodge;
              background:linear-gradient(to bottom, transparent 40%, rgba(255,255,255,.07) 50%, transparent 60%);
              background-size:100% 250%; animation:fxRoll 7s linear infinite; }
@keyframes fxRoll { from { background-position:0 130%; } to { background-position:0 -130%; } }
.card { --gx:50%; --gy:40%; --g-on:0; }
.fx-glare   { z-index:3; mix-blend-mode:screen; opacity:calc(.55 + .45 * var(--g-on));
              background:
                radial-gradient(ellipse 26% 30% at var(--gx) var(--gy), rgba(255,255,255,.13) 0%, rgba(255,255,255,.04) 45%, transparent 100%),
                radial-gradient(ellipse 70% 16% at var(--gx) var(--gy), rgba(220,235,255,.06) 0%, transparent 100%); }
#fx-smudge  { z-index:3; mix-blend-mode:screen; opacity:calc(.35 + .65 * var(--g-on));
              -webkit-mask-image:radial-gradient(ellipse 40% 46% at var(--gx) var(--gy), #000 0%, rgba(0,0,0,.35) 50%, transparent 100%);
                      mask-image:radial-gradient(ellipse 40% 46% at var(--gx) var(--gy), #000 0%, rgba(0,0,0,.35) 50%, transparent 100%); }
#fx-scratch { z-index:3; mix-blend-mode:screen; }
@media (prefers-reduced-motion: reduce) { .fx-roll { animation:none; } }
</style>
</head>
<body>
<div class="card" id="card">
  <canvas id="cv"></canvas>
  <canvas id="fx-ca" class="fx-layer" aria-hidden="true"></canvas>
  <div class="fx-layer fx-scan" aria-hidden="true"></div>
  <div class="fx-layer fx-roll" aria-hidden="true"></div>
  <div class="fx-layer fx-glare" aria-hidden="true"></div>
  <canvas id="fx-smudge" class="fx-layer" aria-hidden="true"></canvas>
  <canvas id="fx-scratch" class="fx-layer" aria-hidden="true"></canvas>
</div>
<script>
const card = document.getElementById('card');
const cv   = document.getElementById('cv');
const ctx  = cv.getContext('2d');

let W, H, t = 0;
let cols, rows, cellW, cellH;
let heights, targetHeights;
const mouse = { x:-9999, y:-9999, inside:false };

const ISO_ANGLE = 26;
const ISO_RAD   = ISO_ANGLE * Math.PI / 180;
const MAX_H     = 110;
const LERP_SPD  = 0.10;
const TWO_PI    = Math.PI * 2;

let vx, vy;

// ─────────────────────────────────────────────────────────────────────────────
// PARALLAX STARFIELD — 3 layers at different depths
// Layer 0: far, tiny, slow drift
// Layer 1: mid, standard
// Layer 2: near, slightly larger, faster drift
// ─────────────────────────────────────────────────────────────────────────────
const LAYER_CFG = [
  { count:110, maxY:0.62, rChance:0.05, rBig:1.0, rSml:0.5, baseMin:0.28, baseMax:0.50, drift:0.008, flickRate:220 },
  { count:80,  maxY:0.58, rChance:0.14, rBig:1.5, rSml:1.0, baseMin:0.42, baseMax:0.68, drift:0.018, flickRate:150 },
  { count:30,  maxY:0.48, rChance:0.30, rBig:2.0, rSml:1.2, baseMin:0.55, baseMax:0.80, drift:0.032, flickRate:100 },
];

let starLayers = [[], [], []];

function buildStars(){
  starLayers = [[], [], []];
  LAYER_CFG.forEach((cfg, li) => {
    for(let i = 0; i < cfg.count; i++){
      starLayers[li].push({
        x:    Math.random() * W,
        y:    Math.random() * H * cfg.maxY,
        r:    Math.random() < cfg.rChance ? cfg.rBig : cfg.rSml,
        base: cfg.baseMin + Math.random() * (cfg.baseMax - cfg.baseMin),
        flicker: 0,
        flickerTimer: Math.floor(Math.random() * cfg.flickRate),
        tint: i % 3,   // 0=white 1=pink 2=blue
        ox: Math.random() * W  // origin x for drift offset
      });
    }
  });
}

function drawStars(){
  LAYER_CFG.forEach((cfg, li) => {
    const layer = starLayers[li];
    for(let i = 0; i < layer.length; i++){
      const s = layer[i];
      // Gentle horizontal parallax drift
      const sx = (s.x + t * cfg.drift * 30) % W;
      s.flickerTimer--;
      if(s.flickerTimer <= 0){
        s.flicker = 1.0;
        s.flickerTimer = cfg.flickRate + Math.floor(Math.random() * cfg.flickRate);
      }
      if(s.flicker > 0) s.flicker = Math.max(0, s.flicker - 0.045);
      const a = Math.min(1, s.base + s.flicker * 2.2);
      ctx.fillStyle = s.tint === 0 ? `rgba(255,255,255,${a.toFixed(2)})`
                    : s.tint === 1 ? `rgba(255,175,255,${a.toFixed(2)})`
                                   : `rgba(175,210,255,${a.toFixed(2)})`;
      ctx.fillRect(sx, s.y, s.r, s.r);
    }
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// DISTANT GALAXY SMUDGE — one faint elongated ellipse in sky
// ─────────────────────────────────────────────────────────────────────────────
function drawGalaxySmudge(){
  const gx = W * 0.68, gy = H * 0.14;
  ctx.save();
  ctx.translate(gx, gy);
  ctx.rotate(-0.38);  // slight tilt
  ctx.scale(2.6, 1);  // stretch horizontally to make ellipse
  const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, W * 0.11);
  gr.addColorStop(0,    'rgba(200,160,255,0.09)');
  gr.addColorStop(0.35, 'rgba(160,100,220,0.05)');
  gr.addColorStop(0.7,  'rgba(100,60,180,0.02)');
  gr.addColorStop(1,    'rgba(0,0,0,0)');
  ctx.fillStyle = gr;
  ctx.beginPath();
  ctx.arc(0, 0, W * 0.11, 0, TWO_PI);
  ctx.fill();
  ctx.restore();

  // Tiny bright core of the galaxy
  ctx.fillStyle = 'rgba(230,200,255,0.22)';
  ctx.fillRect(gx - 1, gy - 0.5, 2, 1);
}

// ─────────────────────────────────────────────────────────────────────────────
// NEBULA COLOR WASH — drifting blobs
// ─────────────────────────────────────────────────────────────────────────────
function drawNebulaWash(){
  const b1x = W * (0.25 + Math.sin(t * 0.07) * 0.12);
  const b1y = H * (0.28 + Math.sin(t * 0.05) * 0.08);
  const g1 = ctx.createRadialGradient(b1x, b1y, 0, b1x, b1y, W * 0.40);
  g1.addColorStop(0,   'rgba(150,35,195,0.14)');
  g1.addColorStop(0.5, 'rgba(90,18,150,0.07)');
  g1.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);

  const b2x = W * (0.74 + Math.sin(t * 0.06 + 1.2) * 0.10);
  const b2y = H * (0.20 + Math.sin(t * 0.08 + 0.5) * 0.07);
  const g2 = ctx.createRadialGradient(b2x, b2y, 0, b2x, b2y, W * 0.30);
  g2.addColorStop(0,   'rgba(35,75,215,0.12)');
  g2.addColorStop(0.5, 'rgba(18,45,155,0.06)');
  g2.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);

  const b3x = W * (0.48 + Math.sin(t * 0.04 + 2.5) * 0.14);
  const b3y = H * (0.16 + Math.sin(t * 0.09) * 0.06);
  const g3 = ctx.createRadialGradient(b3x, b3y, 0, b3x, b3y, W * 0.20);
  g3.addColorStop(0,   'rgba(215,28,135,0.09)');
  g3.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = g3; ctx.fillRect(0, 0, W, H);
}

// ─────────────────────────────────────────────────────────────────────────────
// HORIZON GLOW
// ─────────────────────────────────────────────────────────────────────────────
let horizonGrad = null;
function buildHorizon(){
  const hy = H * 0.68;
  horizonGrad = ctx.createLinearGradient(0, hy - H*0.10, 0, hy + H*0.06);
  horizonGrad.addColorStop(0,   'rgba(0,0,0,0)');
  horizonGrad.addColorStop(0.4, 'rgba(120,40,200,0.20)');
  horizonGrad.addColorStop(0.6, 'rgba(180,60,255,0.11)');
  horizonGrad.addColorStop(1,   'rgba(0,0,0,0)');
}
function drawHorizon(){
  ctx.fillStyle = horizonGrad;
  ctx.fillRect(0, H * 0.56, W, H * 0.24);
}

// ─────────────────────────────────────────────────────────────────────────────
// GROUND FOG — haze sitting just below the mesh horizon
// ─────────────────────────────────────────────────────────────────────────────
let fogGrad = null;
function buildFog(){
  const fy = H * 0.72;
  fogGrad = ctx.createLinearGradient(0, fy - H*0.04, 0, fy + H*0.10);
  fogGrad.addColorStop(0,    'rgba(0,0,0,0)');
  fogGrad.addColorStop(0.25, 'rgba(80,20,140,0.18)');
  fogGrad.addColorStop(0.55, 'rgba(50,10,100,0.28)');
  fogGrad.addColorStop(1,    'rgba(6,3,16,0.55)');
}
function drawFog(){
  ctx.fillStyle = fogGrad;
  ctx.fillRect(0, H * 0.68, W, H * 0.32);
}

// ─────────────────────────────────────────────────────────────────────────────
// EDGE PULSE WAVE
// ─────────────────────────────────────────────────────────────────────────────
let pulsePhase = 0;
const PULSE_SPEED = 0.018, PULSE_WIDTH = 6.0;
function getPulseBoost(c, r){
  const pos = c + r * 0.6, total = cols + rows * 0.6;
  const wave = pulsePhase % total;
  const d = Math.min(Math.abs(pos - wave), total - Math.abs(pos - wave));
  if(d > PULSE_WIDTH) return 0;
  return Math.pow(1 - d / PULSE_WIDTH, 2) * 0.7;
}

// ─────────────────────────────────────────────────────────────────────────────
// HUD TEXT OVERLAY
// ─────────────────────────────────────────────────────────────────────────────
const TOTAL_STARS = LAYER_CFG.reduce((s,c) => s + c.count, 0);
const HUD_BR = [
  'NEBULAPUNK // BLENDER',
  'RAYMARCHING',
  'FX: NEBULA + HOLOGRAM',
  'TARGET: ANY MESH',
  `STARS: ${TOTAL_STARS}`,
];
let hudFlicker = new Float32Array(HUD_BR.length).fill(1);
let hudTimer = 0;
function drawHUD(){
  hudTimer++;
  if(hudTimer % 90 === 0) hudFlicker[Math.floor(Math.random()*hudFlicker.length)] = 0.15 + Math.random()*0.4;
  for(let i=0;i<hudFlicker.length;i++) if(hudFlicker[i]<1) hudFlicker[i]=Math.min(1,hudFlicker[i]+0.06);
  ctx.font = '10px monospace';
  const pad = 18;
  HUD_BR.forEach((txt, i) => {
    ctx.fillStyle = `rgba(195,155,255,${(0.30 * hudFlicker[i]).toFixed(2)})`;
    ctx.fillText(txt, W - pad - ctx.measureText(txt).width, H - pad - (HUD_BR.length - 1 - i) * 16);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// NEBULA VIGNETTE
// ─────────────────────────────────────────────────────────────────────────────
let vignetteGrad = null;
function buildVignette(){
  vignetteGrad = ctx.createRadialGradient(W*0.62,H*0.5,H*0.28,W*0.62,H*0.5,H*0.92);
  vignetteGrad.addColorStop(0,    'rgba(0,0,0,0)');
  vignetteGrad.addColorStop(0.45, 'rgba(8,2,22,0.22)');
  vignetteGrad.addColorStop(1,    'rgba(4,0,14,0.92)');
}
function drawVignette(){ ctx.fillStyle=vignetteGrad; ctx.fillRect(0,0,W,H); }

// ─────────────────────────────────────────────────────────────────────────────
// CORE MESH
// ─────────────────────────────────────────────────────────────────────────────
function lerp(a,b,t){ return a+(b-a)*t; }
function noise(x,y,t2){
  return Math.sin(x*0.8+t2*0.6)*0.45 + Math.sin(y*0.6+t2*0.4)*0.35 + Math.sin((x+y)*0.5+t2*0.7)*0.20;
}
function edgeColor(norm, alpha, pulse){
  const r  = Math.min(255, Math.round(lerp(60,255,norm) + norm*norm*60));
  const g  = Math.round(lerp(20,60,norm));
  const b  = Math.round(lerp(200,180,norm));
  const a  = Math.min(1, alpha + pulse*0.6);
  return `rgba(${Math.min(255,r+Math.round(pulse*80))},${Math.min(255,g+Math.round(pulse*120))},${Math.min(255,b+Math.round(pulse*60))},${a.toFixed(2)})`;
}

function resize(){
  W = cv.width  = card.offsetWidth;
  H = cv.height = card.offsetHeight;
  build();
}

function build(){
  cols=28; rows=16;
  cellW=(W*0.88)/cols; cellH=(H*0.52)/rows;
  const vCount=(cols+1)*(rows+1);
  heights=new Float32Array(vCount); targetHeights=new Float32Array(vCount);
  vx=new Float32Array(vCount); vy=new Float32Array(vCount);
  buildStars(); buildVignette(); buildHorizon(); buildFog();
}

function project(){
  const ox=W*0.5, oy=H*0.70;
  for(let r=0;r<=rows;r++) for(let c=0;c<=cols;c++){
    const idx=r*(cols+1)+c;
    const ix=(c-cols/2)*cellW+(r-rows/2)*cellW*0.5;
    const iy=(r-rows/2)*cellH*Math.cos(ISO_RAD);
    vx[idx]=ox+ix+(c-cols/2)*cellH*0.28;
    vy[idx]=oy+iy-heights[idx];
  }
}

function drawMesh(){
  pulsePhase+=PULSE_SPEED;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const i00=r*(cols+1)+c, i10=i00+1, i01=(r+1)*(cols+1)+c, i11=i01+1;
    const h00=heights[i00],h10=heights[i10],h01=heights[i01],h11=heights[i11];
    const nA=((h00+h10+h01)/3)/MAX_H, nB=((h10+h11+h01)/3)/MAX_H;
    const pulse=getPulseBoost(c,r);
    ctx.lineWidth=0.7+pulse*0.8;

    ctx.beginPath();
    ctx.moveTo(vx[i00],vy[i00]); ctx.lineTo(vx[i10],vy[i10]); ctx.lineTo(vx[i01],vy[i01]);
    ctx.closePath();
    ctx.strokeStyle=edgeColor(nA,0.18+nA*0.55,pulse); ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(vx[i10],vy[i10]); ctx.lineTo(vx[i11],vy[i11]); ctx.lineTo(vx[i01],vy[i01]);
    ctx.closePath();
    ctx.strokeStyle=edgeColor(nB,0.18+nB*0.55,pulse); ctx.stroke();
  }
}

function drawVertices(){
  for(let r=0;r<=rows;r++) for(let c=0;c<=cols;c++){
    const idx=r*(cols+1)+c;
    const norm=heights[idx]/MAX_H;
    if(norm<0.02) continue;
    const x=vx[idx], y=vy[idx];
    const dotR=0.8+norm*2.2, alpha=0.35+norm*0.65, pulse=getPulseBoost(c,r);
    const glow=ctx.createRadialGradient(x,y,0,x,y,dotR*3.5);
    glow.addColorStop(0, norm>0.6
      ? `rgba(255,150,230,${(alpha*0.35+pulse*0.25).toFixed(2)})`
      : `rgba(140,100,255,${(alpha*0.30+pulse*0.20).toFixed(2)})`);
    glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(x,y,dotR*3.5,0,TWO_PI); ctx.fill();
    const coreA=Math.min(1,alpha+pulse*0.5);
    ctx.fillStyle=norm>0.6?`rgba(255,210,255,${coreA.toFixed(2)})`:`rgba(190,165,255,${coreA.toFixed(2)})`;
    ctx.beginPath(); ctx.arc(x,y,dotR+pulse*1.2,0,TWO_PI); ctx.fill();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// MAIN LOOP
// ─────────────────────────────────────────────────────────────────────────────
function draw(){
  ctx.clearRect(0,0,W,H);
  t+=0.016;

  // Layer 1: deep space
  drawNebulaWash();
  drawGalaxySmudge();
  drawStars();
  drawHorizon();

  // Layer 2: update + project + draw mesh
  for(let r=0;r<=rows;r++) for(let c=0;c<=cols;c++){
    const idx=r*(cols+1)+c;
    let target=(noise(c*0.18,r*0.22,t)*0.5+0.5)*MAX_H*0.48;
    if(mouse.inside){
      const ox=W*0.5,oy=H*0.70;
      const ix=(c-cols/2)*cellW+(r-rows/2)*cellW*0.5;
      const iy=(r-rows/2)*cellH*Math.cos(ISO_RAD);
      const sx=ox+ix+(c-cols/2)*cellH*0.28, sy=oy+iy;
      const dx=sx-mouse.x, dy=sy-mouse.y, dist2=dx*dx+dy*dy, rad=140;
      if(dist2<rad*rad) target+=Math.pow(1-Math.sqrt(dist2)/rad,2)*MAX_H*0.88;
    }
    targetHeights[idx]=target;
    heights[idx]=lerp(heights[idx],target,LERP_SPD);
  }
  project();
  drawMesh();
  drawVertices();

  // Layer 3: ground fog over mesh base
  drawFog();

  // Layer 4: vignette + HUD
  drawVignette();
  drawHUD();

  requestAnimationFrame(draw);
}

card.addEventListener('mousemove',e=>{
  const rect=card.getBoundingClientRect();
  mouse.x=e.clientX-rect.left; mouse.y=e.clientY-rect.top;
});
card.addEventListener('mouseenter',()=>mouse.inside=true);
card.addEventListener('mouseleave',()=>{ mouse.inside=false; mouse.x=-9999; mouse.y=-9999; });
window.addEventListener('resize',resize);
resize(); draw();
</script>
<script>
/* ===== Screen FX =====
   Reads the card's own canvas (#cv) for the chromatic aberration; everything else is
   independent of the card's drawing code. Glass uses a fixed seed, so it is the same every visit. */
(() => {
  const card = document.getElementById('card');
  const src  = document.getElementById('cv');
  const caCv = document.getElementById('fx-ca'),      caX = caCv.getContext('2d');
  const smCv = document.getElementById('fx-smudge');
  const scCv = document.getElementById('fx-scratch'), scX = scCv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let CW = 1, CH = 1, dpr = 1, scratches = [], micro = new Float32Array(0);

  // ---------- pointer: smoothed, drifts on its own when idle ----------
  let tx = .5, ty = .5, cx = .5, cy = .5, on = 0, present = false, last = 0, mx = -1, my = -1;
  card.addEventListener('pointermove', e => {
    const r = card.getBoundingClientRect();
    mx = e.clientX - r.left; my = e.clientY - r.top;
    tx = mx / r.width; ty = my / r.height; present = true; last = performance.now();
  });
  card.addEventListener('pointerleave', () => { present = false; });

  // each card gets its own glass: seeds come from the page title
  const SEED = [...document.title].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) % 100000, 7);
  const rng = s => { s = (s + SEED) % 2147483646 + 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
  const noise1 = rnd => { const k = Array.from({ length: 12 }, rnd);
    return u => { const x = u * 11, i = Math.floor(x), f = x - i, t = f * f * (3 - 2 * f);
                  return k[i] * (1 - t) + k[Math.min(11, i + 1)] * t; }; };

  function build() {
    CW = Math.max(1, card.offsetWidth); CH = Math.max(1, card.offsetHeight);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    const area = (CW * CH) / (1200 * 675);
    const sc = Math.max(.45, Math.min(1, Math.min(CW, CH) / 600));   // scale marks to the card size

    // ----- smudges -----
    smCv.width = Math.round(CW * dpr); smCv.height = Math.round(CH * dpr);
    const c = smCv.getContext('2d'), rnd = rng(11), W = smCv.width, H = smCv.height, k = dpr * sc;
    c.clearRect(0, 0, W, H);
    const blob = (x, y, rx, ry, rot, a) => {
      c.save(); c.translate(x, y); c.rotate(rot); c.scale(1, ry / rx);
      const g = c.createRadialGradient(0, 0, 0, 0, 0, rx);
      g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(.3, `rgba(255,255,255,${a * .75})`);
      g.addColorStop(.6, `rgba(255,255,255,${a * .3})`); g.addColorStop(.85, `rgba(255,255,255,${a * .08})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, rx, 0, Math.PI * 2); c.fill(); c.restore();
    };
    for (let i = 0; i < Math.max(8, Math.round(40 * area)); i++)
      blob(rnd() * W, rnd() * H, (100 + rnd() * 260) * k, (70 + rnd() * 190) * k, rnd() * Math.PI, .025 + rnd() * .04);
    for (let j = 0; j < Math.max(2, Math.round(7 * area) + 1); j++) {
      let x = rnd() * W, y = rnd() * H, a = rnd() * Math.PI * 2; const turn = (rnd() - .5) * .05;
      for (let i = 0; i < 22; i++) { blob(x, y, (45 + rnd() * 35) * k, (14 + rnd() * 10) * k, a, .03 + rnd() * .03);
        x += Math.cos(a) * 20 * k; y += Math.sin(a) * 20 * k; a += turn; }
    }
    for (let i = 0; i < Math.max(2, Math.round(6 * area)); i++)
      blob(rnd() * W, rnd() * H, (40 + rnd() * 20) * k, (55 + rnd() * 25) * k, rnd() * Math.PI, .06 + rnd() * .04);
    for (let i = 0; i < Math.max(12, Math.round(60 * area)); i++) {
      const d = (2.5 + rnd() * 3.5) * dpr; blob(rnd() * W, rnd() * H, d, d, 0, .14 + rnd() * .16); }

    // ----- scratches (geometry; lit per frame) -----
    scCv.width = Math.round(CW * dpr); scCv.height = Math.round(CH * dpr);
    const R = rng(29); scratches = [];
    const make = (x, y, ang, len, curve, depth, width) => {
      const n = Math.max(3, Math.round(len / 6)), nz = noise1(R), pts = [];
      let a = ang, px = x, py = y;
      for (let i = 0; i <= n; i++) {
        const u = i / n, taper = Math.pow(Math.sin(Math.PI * u), .6);
        let d = depth * taper * (.35 + .65 * nz(u)); if (nz(1 - u) < .22) d *= .08;
        pts.push(px, py, d); a += curve / n; px += Math.cos(a) * len / n; py += Math.sin(a) * len / n;
      }
      scratches.push({ pts, width, minX: Math.min(x, px) - 10, maxX: Math.max(x, px) + 10,
                       minY: Math.min(y, py) - 10, maxY: Math.max(y, py) + 10 });
    };
    for (let j = 0; j < Math.max(3, Math.round(14 * area) + 1); j++) {
      const ox = R() * CW, oy = R() * CH, base = R() * Math.PI, curve = (R() - .5) * .9;
      const count = 20 + Math.round(R() * 34);
      for (let i = 0; i < count; i++) {
        const off = (R() - .5) * 90 * sc;
        make(ox + Math.cos(base + Math.PI / 2) * off + (R() - .5) * 60 * sc,
             oy + Math.sin(base + Math.PI / 2) * off + (R() - .5) * 60 * sc,
             base + (R() - .5) * .12, (30 + R() * 190) * sc, curve + (R() - .5) * .15, .35 + R() * .5, .45 + R() * .3);
      }
    }
    for (let i = 0; i < Math.max(2, Math.round(10 * area)); i++)
      make(R() * CW, R() * CH, R() * Math.PI * 2, (160 + R() * 420) * sc, (R() - .5) * .6, .7 + R() * .3, .7 + R() * .5);
    for (let i = 0; i < Math.max(150, Math.round(700 * area)); i++)
      make(R() * CW, R() * CH, R() * Math.PI * 2, 4 + R() * 22, (R() - .5) * .4, .25 + R() * .45, .4 + R() * .25);
    const M = rng(53), nMicro = Math.max(700, Math.round(3200 * area));
    micro = new Float32Array(nMicro * 5);
    const patches = Array.from({ length: 6 }, () => [M() * CW, M() * CH, (60 + M() * 120) * sc]);
    for (let i = 0; i < nMicro; i++) {
      let x, y;
      if (M() < .4) { const [px, py, pr] = patches[Math.floor(M() * 6)]; const a = M() * Math.PI * 2, d = pr * Math.sqrt(M());
                       x = px + Math.cos(a) * d; y = py + Math.sin(a) * d; }
      else { x = M() * CW; y = M() * CH; }
      const a = M() * Math.PI * 2, len = 1.5 + M() * 4.5;
      micro.set([x, y, x + Math.cos(a) * len, y + Math.sin(a) * len, .45 + M() * .55], i * 5);
    }

    // ----- aberration canvas -----
    caCv.width = Math.round(CW * dpr); caCv.height = Math.round(CH * dpr);
  }

  // ---------- chromatic aberration: copy the card canvas around the cursor, split red/blue ----------
  const tmp = document.createElement('canvas'), tX = tmp.getContext('2d');
  function aberration() {
    caX.setTransform(1, 0, 0, 1, 0, 0);
    caX.clearRect(0, 0, caCv.width, caCv.height);
    if (on < .01 || mx < 0) return;
    const R = Math.round(Math.min(CW, CH) * .34), E = .018 * on;
    const S = Math.round(R * 2 * dpr);
    if (tmp.width !== S) { tmp.width = tmp.height = S; }
    const k = src.width / CW;                                       // card canvas pixels per CSS px
    const pass = (col, scale) => {
      // draw the card canvas scaled about the cursor into tmp, keep one colour channel
      tX.globalCompositeOperation = 'source-over'; tX.clearRect(0, 0, S, S);
      const sw = (R * 2) / scale;                                    // source size in CSS px
      const drawSrc = () => tX.drawImage(src, (mx - sw / 2) * k, (my - sw / 2) * k, sw * k, sw * k, 0, 0, S, S);
      drawSrc();
      tX.globalCompositeOperation = 'multiply'; tX.fillStyle = col; tX.fillRect(0, 0, S, S);
      tX.globalCompositeOperation = 'destination-in'; drawSrc();
      caX.globalCompositeOperation = 'lighter';
      caX.drawImage(tmp, (mx - R) * dpr, (my - R) * dpr);
    };
    pass('rgb(255,40,60)', 1 + E);
    pass('rgb(40,90,255)', 1 - E);
    // soft disc, faded out right under the cursor (lens centre)
    caX.globalCompositeOperation = 'destination-in';
    const g = caX.createRadialGradient(mx * dpr, my * dpr, 0, mx * dpr, my * dpr, R * dpr);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.25, 'rgba(0,0,0,.6)');
    g.addColorStop(.6, 'rgba(0,0,0,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    caX.fillStyle = g; caX.fillRect(0, 0, caCv.width, caCv.height);
    caX.globalCompositeOperation = 'source-over';
  }

  // ---------- scratches lit by the glare ----------
  const LEVELS = 16;
  const paths = Array.from({ length: LEVELS }, () => []), microPaths = Array.from({ length: LEVELS }, () => []);
  function scratchesFrame(lx, ly) {
    const reach = Math.min(CW, CH) * .42, gain = .28 + .72 * on;
    scX.setTransform(dpr, 0, 0, dpr, 0, 0); scX.clearRect(0, 0, CW, CH);
    for (const p of paths) p.length = 0; for (const p of microPaths) p.length = 0;
    const r2 = reach * 1.6;
    for (const s of scratches) {
      if (s.maxX < lx - r2 || s.minX > lx + r2 || s.maxY < ly - r2 || s.minY > ly + r2) continue;
      const P = s.pts;
      for (let i = 0; i < P.length - 3; i += 3) {
        const x0 = P[i], y0 = P[i + 1], x1 = P[i + 3], y1 = P[i + 4], depth = (P[i + 2] + P[i + 5]) * .5;
        if (depth < .02) continue;
        const dx = (x0 + x1) * .5 - lx, dy = (y0 + y1) * .5 - ly, dist = Math.hypot(dx, dy) || 1;
        const fall = Math.exp(-(dist / reach) * (dist / reach)); if (fall < .02) continue;
        let ux = x1 - x0, uy = y1 - y0; const tl = Math.hypot(ux, uy) || 1;
        const cos = (ux * dx + uy * dy) / (tl * dist), spec = Math.exp(-(cos * cos) / .06);
        const b = Math.min(1, depth * fall * (.05 + .95 * spec) * gain * 1.0);
        const lvl = Math.min(LEVELS - 1, Math.round(b * (LEVELS - 1))); if (lvl < 1) continue;
        paths[lvl].push(x0, y0, x1, y1, s.width);
      }
    }
    for (let i = 0; i < micro.length; i += 5) {
      const x0 = micro[i], y0 = micro[i + 1], dx = x0 - lx, dy = y0 - ly;
      if (dx > r2 || dx < -r2 || dy > r2 || dy < -r2) continue;
      const dist = Math.hypot(dx, dy) || 1, fall = Math.exp(-(dist / reach) * (dist / reach)); if (fall < .03) continue;
      const ux = micro[i + 2] - x0, uy = micro[i + 3] - y0, tl = Math.hypot(ux, uy) || 1;
      const cos = (ux * dx + uy * dy) / (tl * dist), spec = Math.exp(-(cos * cos) / .015);
      const b = Math.min(1, micro[i + 4] * fall * spec * gain * 1.6);
      const lvl = Math.min(LEVELS - 1, Math.round(b * (LEVELS - 1))); if (lvl < 1) continue;
      microPaths[lvl].push(x0, y0, micro[i + 2], micro[i + 3]);
    }
    scX.lineCap = 'round'; scX.lineWidth = .35;
    for (let l = 1; l < LEVELS; l++) { const p = microPaths[l]; if (!p.length) continue;
      scX.strokeStyle = `rgba(255,255,255,${(l / LEVELS).toFixed(3)})`; scX.beginPath();
      for (let i = 0; i < p.length; i += 4) { scX.moveTo(p[i], p[i + 1]); scX.lineTo(p[i + 2], p[i + 3]); }
      scX.stroke(); }
    for (let l = 1; l < LEVELS; l++) { const p = paths[l]; if (!p.length) continue;
      scX.strokeStyle = `rgba(236,242,255,${(l / LEVELS).toFixed(3)})`;
      for (const wide of [false, true]) { scX.lineWidth = wide ? .95 : .55; scX.beginPath();
        for (let i = 0; i < p.length; i += 5) { if ((p[i + 4] > .75) !== wide) continue;
          scX.moveTo(p[i], p[i + 1]); scX.lineTo(p[i + 2], p[i + 3]); }
        scX.stroke(); } }
  }

  function frame(now) {
    const s = now / 1000, idle = !present || now - last > 4000;
    if (idle) { tx = .5 + Math.sin(s * .21) * .28; ty = .45 + Math.cos(s * .16) * .22; }
    on += ((idle ? 0 : 1) - on) * .06;
    const kk = reduce ? 1 : .12; cx += (tx - cx) * kk; cy += (ty - cy) * kk;
    // glare sits up-left of the cursor, as if lit from above, so the effect under the cursor stays clear
    const gx = cx - .07, gy = cy - .13;
    card.style.setProperty('--gx', (gx * 100).toFixed(2) + '%');
    card.style.setProperty('--gy', (gy * 100).toFixed(2) + '%');
    card.style.setProperty('--g-on', on.toFixed(3));
    scratchesFrame(gx * CW, gy * CH);
    aberration();
    requestAnimationFrame(frame);
  }

  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 150); });
  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
