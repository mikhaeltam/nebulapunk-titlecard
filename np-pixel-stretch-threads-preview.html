<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nebulapunk — Threads Preview</title>
<!-- Renders superhive-pixel-stretch-threads.html exactly as written, in an 830px column on white, with the
     real GIFs, so the section can be checked before it goes into Superhive. -->
<style>
body { margin:0; background:#fff; font-family:Inter,'Helvetica Neue',Helvetica,Arial,sans-serif; }
.col { max-width:830px; margin:0 auto; padding:40px 0 240px; }
.note { font-size:12px; color:#8d8aa6; text-align:center; margin:0 0 8px; }
</style>
</head>
<body>
<div class="col">
  <p class="note">Preview of superhive-pixel-stretch-threads.html in an 830px column (not through Superhive's sanitizer)</p>
  <div id="section"><p class="note">Loading…</p></div>
  <h2 style="font-size:32px;font-weight:600;letter-spacing:-0.03em;margin:64px 0 0;color:#000;">Pricing</h2>
</div>
<script>
fetch('superhive-pixel-stretch-threads.html', { cache: 'no-store' })
  .then(r => r.text())
  .then(t => { document.getElementById('section').innerHTML = t; })
  .catch(() => { document.getElementById('section').innerHTML = '<p class="note">Could not load the section file.</p>'; });
</script>
</body>
</html>
