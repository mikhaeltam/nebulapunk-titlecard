<script>
/* Silence the Three.js UMD deprecation notice. The warning is harmless
   (the build still works); we use UMD intentionally so the page works
   on file://, http://, https:// without needing module/import-map setup. */
(function () {
  const originalWarn = console.warn;
  console.warn = function (...args) {
    const first = args[0];
    if (typeof first === 'string' && first.indexOf('build/three.js') !== -1) return;
    return originalWarn.apply(console, args);
  };
})();

<script>
/* =========================================================
   Load Three.js with CDN fallback
   Tries unpkg → jsdelivr → cdnjs. Whichever works first wins.
   ========================================================= */
(function loadThree() {
  const sources = [
    'https://unpkg.com/three@0.160.0/build/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js'
  ];

  function tryNext(i) {
    if (i >= sources.length) {
      const el = document.getElementById('le-error');
      el.style.display = 'block';
      el.innerHTML = '<strong>Could not load Three.js</strong><br><br>' +
        'All CDN sources failed. If you\'re opening this file directly (file://) ' +
        'and your browser blocks CDN requests, host the file on a web server ' +
        '(GitHub Pages, local dev server, etc.) or download three.min.js locally ' +
        'and change the script src to <code>./three.min.js</code>.';
      return;
    }
    const s = document.createElement('script');
    s.src = sources[i];
    s.onload = bootIfReady;
    s.onerror = () => tryNext(i + 1);
    document.head.appendChild(s);
  }

  function bootIfReady() {
    if (window.THREE && typeof window.THREE.Color === 'function') {
      window.__bootLiquidEther && window.__bootLiquidEther();
    }
  }

  tryNext(0);
})();
</script>

<script>
// Defer everything until Three.js is on window. The loader above calls
// window.__bootLiquidEther once a CDN succeeds.
window.__bootLiquidEther = function () {
  // Guard against being called twice if multiple CDNs respond
  if (window.__liquidEtherStarted) return;
  window.__liquidEtherStarted = true;

const THREE = window.THREE;

/* =========================================================
   Configuration — matches the snippet you provided
   ========================================================= */
const config = {
  colors: [
    '#6D28D9', // vivid saturated purple falloff
    '#06C8D4'  // bright cyan — hue shift plays between teal and green around this
  ],
  mouseForce: 17,
  cursorSize: 95,
  isViscous: true,
  viscous: 30,
  iterationsViscous: 50,
  iterationsPoisson: 13,
  resolution: 0.5,
  isBounce: false,
  dt: 0.014,
  BFECC: true,
  autoDemo: true,
  autoSpeed: 0.5,
  autoIntensity: 2.2,
  takeoverDuration: 0.25,
  autoResumeDelay: 3000,
  autoRampDuration: 0.6
};

/* =========================================================
   Palette texture — upsamples keyframe colors into a 256-stop
   gradient interpolated in HSL space. HSL avoids the muddy
   midtones RGB interpolation creates; 256 samples plus the
   GPU's linear filter eliminates visible banding.
   ========================================================= */
function makePaletteTexture(stops) {
  let keys;
  if (Array.isArray(stops) && stops.length > 0) {
    keys = stops.length === 1 ? [stops[0], stops[0]] : stops;
  } else {
    keys = ['#ffffff', '#ffffff'];
  }

  // Convert each keyframe to HSL once
  const tmp = { h: 0, s: 0, l: 0 };
  const hsls = keys.map(hex => {
    const c = new THREE.Color(hex);
    c.getHSL(tmp);
    return { h: tmp.h, s: tmp.s, l: tmp.l };
  });

  const W = 256;
  const data = new Uint8Array(W * 4);
  const segs = hsls.length - 1;
  const out = new THREE.Color();

  for (let i = 0; i < W; i++) {
    // Position in keyframe space: 0..segs
    const t = (i / (W - 1)) * segs;
    const idx = Math.min(Math.floor(t), segs - 1);
    const local = t - idx; // 0..1 within this segment, pure linear
    const k = local;

    const a = hsls[idx];
    const b = hsls[idx + 1];

    // Hue: take the shortest path around the wheel
    let dh = b.h - a.h;
    if (dh > 0.5) dh -= 1;
    if (dh < -0.5) dh += 1;
    let h = a.h + dh * k;
    if (h < 0) h += 1;
    if (h > 1) h -= 1;

    const s = a.s + (b.s - a.s) * k;
    const l = a.l + (b.l - a.l) * k;

    out.setHSL(h, s, l);
    data[i * 4 + 0] = Math.round(out.r * 255);
    data[i * 4 + 1] = Math.round(out.g * 255);
    data[i * 4 + 2] = Math.round(out.b * 255);
    data[i * 4 + 3] = 255;
  }

  const tex = new THREE.DataTexture(data, W, 1, THREE.RGBAFormat);
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearFilter;
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

const paletteTex = makePaletteTexture(config.colors);
const bgVec4 = new THREE.Vector4(0, 0, 0, 0);

/* =========================================================
   Common (renderer + size state)
   ========================================================= */
class CommonClass {
  constructor() {
    this.width = 0;
    this.height = 0;
    this.aspect = 1;
    this.pixelRatio = 1;
    this.container = null;
    this.renderer = null;
    this.clock = null;
    this.time = 0;
    this.delta = 0;
  }
  init(container) {
    this.container = container;
    this.pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    this.resize();
    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    this.renderer.autoClear = false;
    this.renderer.setClearColor(new THREE.Color(0x000000), 0);
    this.renderer.setPixelRatio(this.pixelRatio);
    this.renderer.setSize(this.width, this.height);
    this.renderer.domElement.style.width = '100%';
    this.renderer.domElement.style.height = '100%';
    this.renderer.domElement.style.display = 'block';
    this.clock = new THREE.Clock();
    this.clock.start();
  }
  resize() {
    if (!this.container) return;
    const rect = this.container.getBoundingClientRect();
    this.width = Math.max(1, Math.floor(rect.width));
    this.height = Math.max(1, Math.floor(rect.height));
    this.aspect = this.width / this.height;
    if (this.renderer) this.renderer.setSize(this.width, this.height, false);
  }
  update() {
    this.delta = this.clock.getDelta();
    this.time += this.delta;
  }
}
const Common = new CommonClass();

/* =========================================================
   Mouse / pointer tracking
   ========================================================= */
class MouseClass {
  constructor() {
    this.mouseMoved = false;
    this.coords = new THREE.Vector2();
    this.coords_old = new THREE.Vector2();
    this.diff = new THREE.Vector2();
    this.timer = null;
    this.container = null;
    this.isHoverInside = false;
    this.hasUserControl = false;
    this.isAutoActive = false;
    this.autoIntensity = 2.0;
    this.takeoverActive = false;
    this.takeoverStartTime = 0;
    this.takeoverDuration = 0.25;
    this.takeoverFrom = new THREE.Vector2();
    this.takeoverTo = new THREE.Vector2();
    this.onInteract = null;
    this._onMouseMove = this.onDocumentMouseMove.bind(this);
    this._onTouchStart = this.onDocumentTouchStart.bind(this);
    this._onTouchMove = this.onDocumentTouchMove.bind(this);
    this._onTouchEnd = this.onTouchEnd.bind(this);
    this._onDocumentLeave = this.onDocumentLeave.bind(this);
  }
  init(container) {
    this.container = container;
    window.addEventListener('mousemove', this._onMouseMove);
    window.addEventListener('touchstart', this._onTouchStart, { passive: true });
    window.addEventListener('touchmove', this._onTouchMove, { passive: true });
    window.addEventListener('touchend', this._onTouchEnd);
    document.addEventListener('mouseleave', this._onDocumentLeave);
  }
  dispose() {
    window.removeEventListener('mousemove', this._onMouseMove);
    window.removeEventListener('touchstart', this._onTouchStart);
    window.removeEventListener('touchmove', this._onTouchMove);
    window.removeEventListener('touchend', this._onTouchEnd);
    document.removeEventListener('mouseleave', this._onDocumentLeave);
  }
  isPointInside(x, y) {
    if (!this.container) return false;
    const r = this.container.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return false;
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }
  updateHoverState(x, y) {
    this.isHoverInside = this.isPointInside(x, y);
    return this.isHoverInside;
  }
  setCoords(x, y) {
    if (!this.container) return;
    if (this.timer) clearTimeout(this.timer);
    const r = this.container.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return;
    const nx = (x - r.left) / r.width;
    const ny = (y - r.top) / r.height;
    this.coords.set(nx * 2 - 1, -(ny * 2 - 1));
    this.mouseMoved = true;
    this.timer = setTimeout(() => { this.mouseMoved = false; }, 100);
  }
  setNormalized(nx, ny) {
    this.coords.set(nx, ny);
    this.mouseMoved = true;
  }
  onDocumentMouseMove(e) {
    if (!this.updateHoverState(e.clientX, e.clientY)) return;
    if (this.onInteract) this.onInteract();
    if (this.isAutoActive && !this.hasUserControl && !this.takeoverActive) {
      const r = this.container.getBoundingClientRect();
      if (r.width === 0 || r.height === 0) return;
      const nx = (e.clientX - r.left) / r.width;
      const ny = (e.clientY - r.top) / r.height;
      this.takeoverFrom.copy(this.coords);
      this.takeoverTo.set(nx * 2 - 1, -(ny * 2 - 1));
      this.takeoverStartTime = performance.now();
      this.takeoverActive = true;
      this.hasUserControl = true;
      this.isAutoActive = false;
      return;
    }
    this.setCoords(e.clientX, e.clientY);
    this.hasUserControl = true;
  }
  onDocumentTouchStart(e) {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    if (!this.updateHoverState(t.clientX, t.clientY)) return;
    if (this.onInteract) this.onInteract();
    this.setCoords(t.clientX, t.clientY);
    this.hasUserControl = true;
  }
  onDocumentTouchMove(e) {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    if (!this.updateHoverState(t.clientX, t.clientY)) return;
    if (this.onInteract) this.onInteract();
    this.setCoords(t.clientX, t.clientY);
  }
  onTouchEnd() { this.isHoverInside = false; }
  onDocumentLeave() { this.isHoverInside = false; }
  update() {
    if (this.takeoverActive) {
      const t = (performance.now() - this.takeoverStartTime) / (this.takeoverDuration * 1000);
      if (t >= 1) {
        this.takeoverActive = false;
        this.coords.copy(this.takeoverTo);
        this.coords_old.copy(this.coords);
        this.diff.set(0, 0);
      } else {
        const k = t * t * (3 - 2 * t);
        this.coords.copy(this.takeoverFrom).lerp(this.takeoverTo, k);
      }
    }
    this.diff.subVectors(this.coords, this.coords_old);
    this.coords_old.copy(this.coords);
    if (this.coords_old.x === 0 && this.coords_old.y === 0) this.diff.set(0, 0);
    if (this.isAutoActive && !this.takeoverActive) this.diff.multiplyScalar(this.autoIntensity);
  }
}
const Mouse = new MouseClass();

/* =========================================================
   AutoDriver — drives a virtual cursor when idle
   ========================================================= */
class AutoDriver {
  constructor(mouse, manager, opts) {
    this.mouse = mouse;
    this.manager = manager;
    this.enabled = opts.enabled;
    this.speed = opts.speed;
    this.resumeDelay = opts.resumeDelay || 3000;
    this.rampDurationMs = (opts.rampDuration || 0) * 1000;
    this.active = false;
    this.current = new THREE.Vector2(0, 0);
    this.target = new THREE.Vector2();
    this.lastTime = performance.now();
    this.activationTime = 0;
    this.margin = 0.2;
    this._tmpDir = new THREE.Vector2();
    this.pickNewTarget();
  }
  pickNewTarget() {
    const r = Math.random;
    this.target.set((r() * 2 - 1) * (1 - this.margin), (r() * 2 - 1) * (1 - this.margin));
  }
  forceStop() {
    this.active = false;
    this.mouse.isAutoActive = false;
  }
  update() {
    if (!this.enabled) return;
    const now = performance.now();
    const idle = now - this.manager.lastUserInteraction;
    if (idle < this.resumeDelay) {
      if (this.active) this.forceStop();
      return;
    }
    if (this.mouse.isHoverInside) {
      if (this.active) this.forceStop();
      return;
    }
    if (!this.active) {
      this.active = true;
      this.current.copy(this.mouse.coords);
      this.lastTime = now;
      this.activationTime = now;
    }
    this.mouse.isAutoActive = true;
    let dtSec = (now - this.lastTime) / 1000;
    this.lastTime = now;
    if (dtSec > 0.2) dtSec = 0.016;
    const dir = this._tmpDir.subVectors(this.target, this.current);
    const dist = dir.length();
    if (dist < 0.01) { this.pickNewTarget(); return; }
    dir.normalize();
    let ramp = 1;
    if (this.rampDurationMs > 0) {
      const t = Math.min(1, (now - this.activationTime) / this.rampDurationMs);
      ramp = t * t * (3 - 2 * t);
    }
    const step = this.speed * dtSec * ramp;
    const move = Math.min(step, dist);
    this.current.addScaledVector(dir, move);
    this.mouse.setNormalized(this.current.x, this.current.y);
  }
}

/* =========================================================
   Shaders
   ========================================================= */
const face_vert = `
attribute vec3 position;
uniform vec2 px;
uniform vec2 boundarySpace;
varying vec2 uv;
precision highp float;
void main(){
  vec3 pos = position;
  vec2 scale = 1.0 - boundarySpace * 2.0;
  pos.xy = pos.xy * scale;
  uv = vec2(0.5)+(pos.xy)*0.5;
  gl_Position = vec4(pos, 1.0);
}`;

const line_vert = `
attribute vec3 position;
uniform vec2 px;
precision highp float;
varying vec2 uv;
void main(){
  vec3 pos = position;
  uv = 0.5 + pos.xy * 0.5;
  vec2 n = sign(pos.xy);
  pos.xy = abs(pos.xy) - px * 1.0;
  pos.xy *= n;
  gl_Position = vec4(pos, 1.0);
}`;

const mouse_vert = `
precision highp float;
attribute vec3 position;
attribute vec2 uv;
uniform vec2 center;
uniform vec2 scale;
uniform vec2 px;
varying vec2 vUv;
void main(){
  vec2 pos = position.xy * scale * 2.0 * px + center;
  vUv = uv;
  gl_Position = vec4(pos, 0.0, 1.0);
}`;

const advection_frag = `
precision highp float;
uniform sampler2D velocity;
uniform float dt;
uniform bool isBFECC;
uniform vec2 fboSize;
uniform vec2 px;
varying vec2 uv;
void main(){
  vec2 ratio = max(fboSize.x, fboSize.y) / fboSize;
  if(isBFECC == false){
    vec2 vel = texture2D(velocity, uv).xy;
    vec2 uv2 = uv - vel * dt * ratio;
    vec2 newVel = texture2D(velocity, uv2).xy;
    gl_FragColor = vec4(newVel, 0.0, 0.0);
  } else {
    vec2 spot_new = uv;
    vec2 vel_old = texture2D(velocity, uv).xy;
    vec2 spot_old = spot_new - vel_old * dt * ratio;
    vec2 vel_new1 = texture2D(velocity, spot_old).xy;
    vec2 spot_new2 = spot_old + vel_new1 * dt * ratio;
    vec2 error = spot_new2 - spot_new;
    vec2 spot_new3 = spot_new - error / 2.0;
    vec2 vel_2 = texture2D(velocity, spot_new3).xy;
    vec2 spot_old2 = spot_new3 - vel_2 * dt * ratio;
    vec2 newVel2 = texture2D(velocity, spot_old2).xy;
    gl_FragColor = vec4(newVel2, 0.0, 0.0);
  }
}`;

const color_frag = `
precision highp float;
uniform sampler2D velocity;
uniform sampler2D palette;
uniform vec4 bgColor;
uniform float time;
uniform vec2 mousePos;   // normalized -1..1
uniform float mouseSpeed; // magnitude of cursor movement this frame
varying vec2 uv;

vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec2 mod289(vec2 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec3 permute(vec3 x){ return mod289((34.0*x+1.0)*x); }

float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                     -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1  = (x0.x > x0.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0.0,i1.y,1.0))
                         + i.x + vec3(0.0,i1.x,1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0),dot(x12.xy,x12.xy),
                           dot(x12.zw,x12.zw)), 0.0);
  m = m*m; m = m*m;
  vec3 x  = 2.0*fract(p*C.www) - 1.0;
  vec3 h  = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314*(a0*a0 + h*h);
  vec3 g;
  g.x  = a0.x *x0.x  + h.x *x0.y;
  g.yz = a0.yz*x12.xz + h.yz*x12.yw;
  return 130.0*dot(m,g);
}

vec3 hueShift(vec3 col, float shift){
  float angle = shift * 6.28318530718;
  vec3 k = vec3(0.57735);
  float cosA = cos(angle);
  return col*cosA + cross(k,col)*sin(angle) + k*dot(k,col)*(1.0-cosA);
}

void main(){
  vec2 vel = texture2D(velocity, uv).xy;
  float lenv = clamp(length(vel), 0.0, 1.0);

  vec3 c = texture2D(palette, vec2(lenv, 0.5)).rgb;

  // Distance from cursor in UV space (uv is 0..1, mousePos is -1..1)
  vec2 mousUV = mousePos * 0.5 + 0.5;
  float distToMouse = length(uv - mousUV);

  // Cursor influence: strong near cursor, fades with distance.
  // mouseSpeed boosts the radius so fast movement = wider bloom.
  float radius = 0.35 + mouseSpeed * 1.2;
  float cursorInfluence = exp(-distToMouse * distToMouse / (radius * radius));

  // Noise anchored to cursor position so the shimmer follows it.
  // Two octaves, one drifts slowly with time, one reacts to cursor speed.
  // Noise UV: large scale for smooth aurora bands, gently nudged by
  // the velocity field (not dragged) and loosely anchored to cursor.
  vec2 noiseUV = uv * 1.2 - mousUV * 0.3 + vel * 0.15;
  float n1 = snoise(noiseUV + vec2(time * 0.06, time * 0.04));
  float n2 = snoise(noiseUV * 2.1 - vec2(time * 0.09, time * 0.07));
  float noise = n1 * 0.6 + n2 * 0.4; // -1..1

  // Hue shift: only affects the highlight (lenv = 0 at falloff → no shift there).
  // Falloff stays pinned to base violet; only the cyan peak shimmers.
  float shift = noise * 0.11 * lenv;
  c = hueShift(c, shift);

  vec3 outRGB = mix(bgColor.rgb, c, lenv);
  float outA  = mix(bgColor.a,  1.0, lenv);
  gl_FragColor = vec4(outRGB, outA);
}`;

const divergence_frag = `
precision highp float;
uniform sampler2D velocity;
uniform float dt;
uniform vec2 px;
varying vec2 uv;
void main(){
  float x0 = texture2D(velocity, uv-vec2(px.x, 0.0)).x;
  float x1 = texture2D(velocity, uv+vec2(px.x, 0.0)).x;
  float y0 = texture2D(velocity, uv-vec2(0.0, px.y)).y;
  float y1 = texture2D(velocity, uv+vec2(0.0, px.y)).y;
  float divergence = (x1 - x0 + y1 - y0) / 2.0;
  gl_FragColor = vec4(divergence / dt);
}`;

const externalForce_frag = `
precision highp float;
uniform vec2 force;
uniform vec2 center;
uniform vec2 scale;
uniform vec2 px;
varying vec2 vUv;
void main(){
  vec2 circle = (vUv - 0.5) * 2.0;
  float d = 1.0 - min(length(circle), 1.0);
  d *= d;
  gl_FragColor = vec4(force * d, 0.0, 1.0);
}`;

const poisson_frag = `
precision highp float;
uniform sampler2D pressure;
uniform sampler2D divergence;
uniform vec2 px;
varying vec2 uv;
void main(){
  float p0 = texture2D(pressure, uv + vec2(px.x * 2.0, 0.0)).r;
  float p1 = texture2D(pressure, uv - vec2(px.x * 2.0, 0.0)).r;
  float p2 = texture2D(pressure, uv + vec2(0.0, px.y * 2.0)).r;
  float p3 = texture2D(pressure, uv - vec2(0.0, px.y * 2.0)).r;
  float div = texture2D(divergence, uv).r;
  float newP = (p0 + p1 + p2 + p3) / 4.0 - div;
  gl_FragColor = vec4(newP);
}`;

const pressure_frag = `
precision highp float;
uniform sampler2D pressure;
uniform sampler2D velocity;
uniform vec2 px;
uniform float dt;
varying vec2 uv;
void main(){
  float step = 1.0;
  float p0 = texture2D(pressure, uv + vec2(px.x * step, 0.0)).r;
  float p1 = texture2D(pressure, uv - vec2(px.x * step, 0.0)).r;
  float p2 = texture2D(pressure, uv + vec2(0.0, px.y * step)).r;
  float p3 = texture2D(pressure, uv - vec2(0.0, px.y * step)).r;
  vec2 v = texture2D(velocity, uv).xy;
  vec2 gradP = vec2(p0 - p1, p2 - p3) * 0.5;
  v = v - gradP * dt;
  gl_FragColor = vec4(v, 0.0, 1.0);
}`;

const viscous_frag = `
precision highp float;
uniform sampler2D velocity;
uniform sampler2D velocity_new;
uniform float v;
uniform vec2 px;
uniform float dt;
varying vec2 uv;
void main(){
  vec2 old = texture2D(velocity, uv).xy;
  vec2 new0 = texture2D(velocity_new, uv + vec2(px.x * 2.0, 0.0)).xy;
  vec2 new1 = texture2D(velocity_new, uv - vec2(px.x * 2.0, 0.0)).xy;
  vec2 new2 = texture2D(velocity_new, uv + vec2(0.0, px.y * 2.0)).xy;
  vec2 new3 = texture2D(velocity_new, uv - vec2(0.0, px.y * 2.0)).xy;
  vec2 newv = 4.0 * old + v * dt * (new0 + new1 + new2 + new3);
  newv /= 4.0 * (1.0 + v * dt);
  gl_FragColor = vec4(newv, 0.0, 0.0);
}`;

/* =========================================================
   ShaderPass base + all simulation passes
   ========================================================= */
class ShaderPass {
  constructor(props) {
    this.props = props || {};
    this.uniforms = this.props.material?.uniforms;
    this.scene = null;
    this.camera = null;
    this.material = null;
    this.geometry = null;
    this.plane = null;
  }
  init() {
    this.scene = new THREE.Scene();
    this.camera = new THREE.Camera();
    if (this.uniforms) {
      this.material = new THREE.RawShaderMaterial(this.props.material);
      this.geometry = new THREE.PlaneGeometry(2.0, 2.0);
      this.plane = new THREE.Mesh(this.geometry, this.material);
      this.scene.add(this.plane);
    }
  }
  update() {
    Common.renderer.setRenderTarget(this.props.output || null);
    Common.renderer.render(this.scene, this.camera);
    Common.renderer.setRenderTarget(null);
  }
}

class Advection extends ShaderPass {
  constructor(simProps) {
    super({
      material: {
        vertexShader: face_vert,
        fragmentShader: advection_frag,
        uniforms: {
          boundarySpace: { value: simProps.cellScale },
          px: { value: simProps.cellScale },
          fboSize: { value: simProps.fboSize },
          velocity: { value: simProps.src.texture },
          dt: { value: simProps.dt },
          isBFECC: { value: true }
        }
      },
      output: simProps.dst
    });
    this.uniforms = this.props.material.uniforms;
    this.init();
  }
  init() {
    super.init();
    this.createBoundary();
  }
  createBoundary() {
    const boundaryG = new THREE.BufferGeometry();
    const vertices_boundary = new Float32Array([
      -1, -1, 0, -1, 1, 0, -1, 1, 0, 1, 1, 0, 1, 1, 0, 1, -1, 0, 1, -1, 0, -1, -1, 0
    ]);
    boundaryG.setAttribute('position', new THREE.BufferAttribute(vertices_boundary, 3));
    const boundaryM = new THREE.RawShaderMaterial({
      vertexShader: line_vert,
      fragmentShader: advection_frag,
      uniforms: this.uniforms
    });
    this.line = new THREE.LineSegments(boundaryG, boundaryM);
    this.scene.add(this.line);
  }
  update({ dt, isBounce, BFECC }) {
    this.uniforms.dt.value = dt;
    this.line.visible = isBounce;
    this.uniforms.isBFECC.value = BFECC;
    super.update();
  }
}

class ExternalForce extends ShaderPass {
  constructor(simProps) {
    super({ output: simProps.dst });
    this.init(simProps);
  }
  init(simProps) {
    super.init();
    const mouseG = new THREE.PlaneGeometry(1, 1);
    const mouseM = new THREE.RawShaderMaterial({
      vertexShader: mouse_vert,
      fragmentShader: externalForce_frag,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      uniforms: {
        px: { value: simProps.cellScale },
        force: { value: new THREE.Vector2(0.0, 0.0) },
        center: { value: new THREE.Vector2(0.0, 0.0) },
        scale: { value: new THREE.Vector2(simProps.cursor_size, simProps.cursor_size) }
      }
    });
    this.mouse = new THREE.Mesh(mouseG, mouseM);
    this.scene.add(this.mouse);
  }
  update(props) {
    const forceX = (Mouse.diff.x / 2) * props.mouse_force;
    const forceY = (Mouse.diff.y / 2) * props.mouse_force;
    const cursorSizeX = props.cursor_size * props.cellScale.x;
    const cursorSizeY = props.cursor_size * props.cellScale.y;
    const centerX = Math.min(
      Math.max(Mouse.coords.x, -1 + cursorSizeX + props.cellScale.x * 2),
      1 - cursorSizeX - props.cellScale.x * 2
    );
    const centerY = Math.min(
      Math.max(Mouse.coords.y, -1 + cursorSizeY + props.cellScale.y * 2),
      1 - cursorSizeY - props.cellScale.y * 2
    );
    const u = this.mouse.material.uniforms;
    u.force.value.set(forceX, forceY);
    u.center.value.set(centerX, centerY);
    u.scale.value.set(props.cursor_size, props.cursor_size);
    super.update();
  }
}

class Viscous extends ShaderPass {
  constructor(simProps) {
    super({
      material: {
        vertexShader: face_vert,
        fragmentShader: viscous_frag,
        uniforms: {
          boundarySpace: { value: simProps.boundarySpace },
          velocity: { value: simProps.src.texture },
          velocity_new: { value: simProps.dst_.texture },
          v: { value: simProps.viscous },
          px: { value: simProps.cellScale },
          dt: { value: simProps.dt }
        }
      },
      output: simProps.dst,
      output0: simProps.dst_,
      output1: simProps.dst
    });
    this.init();
  }
  update({ viscous, iterations, dt }) {
    let fbo_in, fbo_out;
    this.uniforms.v.value = viscous;
    for (let i = 0; i < iterations; i++) {
      if (i % 2 === 0) { fbo_in = this.props.output0; fbo_out = this.props.output1; }
      else { fbo_in = this.props.output1; fbo_out = this.props.output0; }
      this.uniforms.velocity_new.value = fbo_in.texture;
      this.props.output = fbo_out;
      this.uniforms.dt.value = dt;
      super.update();
    }
    return fbo_out;
  }
}

class Divergence extends ShaderPass {
  constructor(simProps) {
    super({
      material: {
        vertexShader: face_vert,
        fragmentShader: divergence_frag,
        uniforms: {
          boundarySpace: { value: simProps.boundarySpace },
          velocity: { value: simProps.src.texture },
          px: { value: simProps.cellScale },
          dt: { value: simProps.dt }
        }
      },
      output: simProps.dst
    });
    this.init();
  }
  update({ vel }) {
    this.uniforms.velocity.value = vel.texture;
    super.update();
  }
}

class Poisson extends ShaderPass {
  constructor(simProps) {
    super({
      material: {
        vertexShader: face_vert,
        fragmentShader: poisson_frag,
        uniforms: {
          boundarySpace: { value: simProps.boundarySpace },
          pressure: { value: simProps.dst_.texture },
          divergence: { value: simProps.src.texture },
          px: { value: simProps.cellScale }
        }
      },
      output: simProps.dst,
      output0: simProps.dst_,
      output1: simProps.dst
    });
    this.init();
  }
  update({ iterations }) {
    let p_in, p_out;
    for (let i = 0; i < iterations; i++) {
      if (i % 2 === 0) { p_in = this.props.output0; p_out = this.props.output1; }
      else { p_in = this.props.output1; p_out = this.props.output0; }
      this.uniforms.pressure.value = p_in.texture;
      this.props.output = p_out;
      super.update();
    }
    return p_out;
  }
}

class Pressure extends ShaderPass {
  constructor(simProps) {
    super({
      material: {
        vertexShader: face_vert,
        fragmentShader: pressure_frag,
        uniforms: {
          boundarySpace: { value: simProps.boundarySpace },
          pressure: { value: simProps.src_p.texture },
          velocity: { value: simProps.src_v.texture },
          px: { value: simProps.cellScale },
          dt: { value: simProps.dt }
        }
      },
      output: simProps.dst
    });
    this.init();
  }
  update({ vel, pressure }) {
    this.uniforms.velocity.value = vel.texture;
    this.uniforms.pressure.value = pressure.texture;
    super.update();
  }
}

/* =========================================================
   Simulation orchestrator
   ========================================================= */
class Simulation {
  constructor(options) {
    this.options = {
      iterations_poisson: config.iterationsPoisson,
      iterations_viscous: config.iterationsViscous,
      mouse_force: config.mouseForce,
      resolution: config.resolution,
      cursor_size: config.cursorSize,
      viscous: config.viscous,
      isBounce: config.isBounce,
      dt: config.dt,
      isViscous: config.isViscous,
      BFECC: config.BFECC,
      ...options
    };
    this.fbos = {
      vel_0: null, vel_1: null,
      vel_viscous0: null, vel_viscous1: null,
      div: null,
      pressure_0: null, pressure_1: null
    };
    this.fboSize = new THREE.Vector2();
    this.cellScale = new THREE.Vector2();
    this.boundarySpace = new THREE.Vector2();
    this.init();
  }
  init() {
    this.calcSize();
    this.createAllFBO();
    this.createShaderPass();
  }
  getFloatType() {
    const isIOS = /(iPad|iPhone|iPod)/i.test(navigator.userAgent);
    return isIOS ? THREE.HalfFloatType : THREE.FloatType;
  }
  createAllFBO() {
    const type = this.getFloatType();
    const opts = {
      type,
      depthBuffer: false,
      stencilBuffer: false,
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      wrapS: THREE.ClampToEdgeWrapping,
      wrapT: THREE.ClampToEdgeWrapping
    };
    for (let key in this.fbos) {
      this.fbos[key] = new THREE.WebGLRenderTarget(this.fboSize.x, this.fboSize.y, opts);
    }
  }
  createShaderPass() {
    this.advection = new Advection({
      cellScale: this.cellScale, fboSize: this.fboSize, dt: this.options.dt,
      src: this.fbos.vel_0, dst: this.fbos.vel_1
    });
    this.externalForce = new ExternalForce({
      cellScale: this.cellScale, cursor_size: this.options.cursor_size, dst: this.fbos.vel_1
    });
    this.viscous = new Viscous({
      cellScale: this.cellScale, boundarySpace: this.boundarySpace,
      viscous: this.options.viscous, src: this.fbos.vel_1,
      dst: this.fbos.vel_viscous1, dst_: this.fbos.vel_viscous0, dt: this.options.dt
    });
    this.divergence = new Divergence({
      cellScale: this.cellScale, boundarySpace: this.boundarySpace,
      src: this.fbos.vel_viscous0, dst: this.fbos.div, dt: this.options.dt
    });
    this.poisson = new Poisson({
      cellScale: this.cellScale, boundarySpace: this.boundarySpace,
      src: this.fbos.div, dst: this.fbos.pressure_1, dst_: this.fbos.pressure_0
    });
    this.pressure = new Pressure({
      cellScale: this.cellScale, boundarySpace: this.boundarySpace,
      src_p: this.fbos.pressure_0, src_v: this.fbos.vel_viscous0,
      dst: this.fbos.vel_0, dt: this.options.dt
    });
  }
  calcSize() {
    const w = Math.max(1, Math.round(this.options.resolution * Common.width));
    const h = Math.max(1, Math.round(this.options.resolution * Common.height));
    this.cellScale.set(1.0 / w, 1.0 / h);
    this.fboSize.set(w, h);
  }
  resize() {
    this.calcSize();
    for (let key in this.fbos) {
      this.fbos[key].setSize(this.fboSize.x, this.fboSize.y);
    }
  }
  update() {
    if (this.options.isBounce) this.boundarySpace.set(0, 0);
    else this.boundarySpace.copy(this.cellScale);

    this.advection.update({
      dt: this.options.dt, isBounce: this.options.isBounce, BFECC: this.options.BFECC
    });
    this.externalForce.update({
      cursor_size: this.options.cursor_size, mouse_force: this.options.mouse_force,
      cellScale: this.cellScale
    });
    let vel = this.fbos.vel_1;
    if (this.options.isViscous) {
      vel = this.viscous.update({
        viscous: this.options.viscous,
        iterations: this.options.iterations_viscous,
        dt: this.options.dt
      });
    }
    this.divergence.update({ vel });
    const pressure = this.poisson.update({ iterations: this.options.iterations_poisson });
    this.pressure.update({ vel, pressure });
  }
}

/* =========================================================
   Output (final color pass) + manager
   ========================================================= */
class Output {
  constructor() {
    this.simulation = new Simulation();
    this.scene = new THREE.Scene();
    this.camera = new THREE.Camera();
    this.output = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.RawShaderMaterial({
        vertexShader: face_vert,
        fragmentShader: color_frag,
        transparent: true,
        depthWrite: false,
        uniforms: {
          velocity: { value: this.simulation.fbos.vel_0.texture },
          boundarySpace: { value: new THREE.Vector2() },
          palette: { value: paletteTex },
          bgColor: { value: bgVec4 },
          time: { value: 0.0 },
          mousePos: { value: new THREE.Vector2(0, 0) },
          mouseSpeed: { value: 0.0 }
        }
      })
    );
    this.scene.add(this.output);
  }
  resize() { this.simulation.resize(); }
  render() {
    const u = this.output.material.uniforms;
    u.time.value = Common.time;
    u.mousePos.value.copy(Mouse.coords);
    // Smooth the speed signal so it decays gracefully after cursor stops
    const rawSpeed = Math.min(Mouse.diff.length() * 60.0, 1.0);
    u.mouseSpeed.value += (rawSpeed - u.mouseSpeed.value) * 0.12;
    Common.renderer.setRenderTarget(null);
    Common.renderer.render(this.scene, this.camera);
  }
  update() { this.simulation.update(); this.render(); }
}

class WebGLManager {
  constructor(wrapper, opts) {
    this.wrapper = wrapper;
    Common.init(wrapper);
    Mouse.init(wrapper);
    Mouse.autoIntensity = opts.autoIntensity;
    Mouse.takeoverDuration = opts.takeoverDuration;
    this.lastUserInteraction = performance.now();
    Mouse.onInteract = () => {
      this.lastUserInteraction = performance.now();
      if (this.autoDriver) this.autoDriver.forceStop();
    };
    this.autoDriver = new AutoDriver(Mouse, this, {
      enabled: opts.autoDemo,
      speed: opts.autoSpeed,
      resumeDelay: opts.autoResumeDelay,
      rampDuration: opts.autoRampDuration
    });
    this.wrapper.prepend(Common.renderer.domElement);
    this.output = new Output();
    this.running = false;
    this.rafId = null;
    this.isVisible = true;

    this._resize = () => { Common.resize(); this.output.resize(); };
    window.addEventListener('resize', this._resize);

    this._onVisibility = () => {
      if (document.hidden) this.pause();
      else if (this.isVisible) this.start();
    };
    document.addEventListener('visibilitychange', this._onVisibility);

    this._loop = this._loop.bind(this);
  }
  render() {
    if (this.autoDriver) this.autoDriver.update();
    Mouse.update();
    Common.update();
    this.output.update();
  }
  _loop() {
    if (!this.running) return;
    this.render();
    this.rafId = requestAnimationFrame(this._loop);
  }
  start() {
    if (this.running) return;
    this.running = true;
    this._loop();
  }
  pause() {
    this.running = false;
    if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
  }
}

/* =========================================================
   Boot
   ========================================================= */
const container = document.getElementById('liquid-ether');
const manager = new WebGLManager(container, {
  autoDemo: config.autoDemo,
  autoSpeed: config.autoSpeed,
  autoIntensity: config.autoIntensity,
  takeoverDuration: config.takeoverDuration,
  autoResumeDelay: config.autoResumeDelay,
  autoRampDuration: config.autoRampDuration
});
manager.start();

// Pause when scrolled off-screen
const io = new IntersectionObserver((entries) => {
  const e = entries[0];
  const visible = e.isIntersecting && e.intersectionRatio > 0;
  manager.isVisible = visible;
  if (visible && !document.hidden) manager.start();
  else manager.pause();
}, { threshold: [0, 0.01, 0.1] });
io.observe(container);

// React to container size changes
let resizeRaf = null;
const ro = new ResizeObserver(() => {
  if (resizeRaf) cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(() => {
    Common.resize();
    manager.output.resize();
  });
});
ro.observe(container);

}; // end __bootLiquidEther
</script>
