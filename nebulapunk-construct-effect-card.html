<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nebulapunk — Construct Based Workflow</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#070412; overflow:hidden; }
.card { position:relative; width:100%; height:100%; background:#070412; cursor:none; overflow:hidden; }
canvas { position:absolute; inset:0; pointer-events:none; }
/* ===== Screen FX (same treatment as the intro starfield) =====
   Scan lines + slow roll, chromatic aberration around the cursor, glass glare,
   smudges and light-reactive scratches. All layers ignore the mouse. */
.fx-layer { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
#cv         { filter:brightness(1.35) saturate(1.1); }   /* the card's own animation, brightened */
#fx-ca      { z-index:1; mix-blend-mode:screen; }
/* faint rainbow light leak that passes through the cursor (same as the intro starfield) */
#fx-leak    { z-index:1; mix-blend-mode:screen; opacity:.22; filter:blur(40px) saturate(1.1); }
.fx-scan    { z-index:2; background:repeating-linear-gradient(to bottom, rgba(0,0,0,.5) 0 1px, transparent 1px 3px); }
.fx-roll    { z-index:2; mix-blend-mode:color-dodge;
              background:linear-gradient(to bottom, transparent 40%, rgba(255,255,255,.07) 50%, transparent 60%);
              background-size:100% 250%; animation:fxRoll 7s linear infinite; }
@keyframes fxRoll { from { background-position:0 130%; } to { background-position:0 -130%; } }
.card { --gx:50%; --gy:40%; --g-on:0; }
.fx-glare   { z-index:3; mix-blend-mode:screen; opacity:calc(.55 + .45 * var(--g-on));
              background:
                radial-gradient(ellipse 38% 44% at var(--gx) var(--gy), rgba(255,255,255,.13) 0%, rgba(255,255,255,.04) 45%, transparent 100%),
                radial-gradient(ellipse 95% 22% at var(--gx) var(--gy), rgba(220,235,255,.06) 0%, transparent 100%); }
#fx-smudge  { z-index:3; mix-blend-mode:screen; opacity:calc(.35 + .65 * var(--g-on));
              -webkit-mask-image:radial-gradient(ellipse 56% 62% at var(--gx) var(--gy), #000 0%, rgba(0,0,0,.35) 50%, transparent 100%);
                      mask-image:radial-gradient(ellipse 56% 62% at var(--gx) var(--gy), #000 0%, rgba(0,0,0,.35) 50%, transparent 100%); }
#fx-scratch { z-index:3; mix-blend-mode:screen; }
@media (prefers-reduced-motion: reduce) { .fx-roll { animation:none; } }
</style>
</head>
<body>
<div class="card" id="card">
  <canvas id="cv"></canvas>
  <canvas id="fx-ca" class="fx-layer" aria-hidden="true"></canvas>
  <canvas id="fx-leak" class="fx-layer" aria-hidden="true"></canvas>
  <div class="fx-layer fx-scan" aria-hidden="true"></div>
  <div class="fx-layer fx-roll" aria-hidden="true"></div>
  <div class="fx-layer fx-glare" aria-hidden="true"></div>
  <canvas id="fx-smudge" class="fx-layer" aria-hidden="true"></canvas>
  <canvas id="fx-scratch" class="fx-layer" aria-hidden="true"></canvas>
</div>
<script>
const card = document.getElementById('card');
const cv   = document.getElementById('cv');
const ctx  = cv.getContext('2d');

let W, H, dots = [], t = 0;
const mouse = { x:-9999, y:-9999, inside:false };
let lensStr = 0;

const PAL = [
  [244,114,182],[167,139,250],[96,165,250],
  [220,100,200],[200,130,255],[248,180,255],
];

function rnd(a,b){ return a+(b-a)*Math.random(); }
function lerp(a,b,t){ return a+(b-a)*t; }

function resize(){
  W = cv.width  = card.offsetWidth;
  H = cv.height = card.offsetHeight;
  build();
}

function build(){
  dots = [];
  const count = Math.floor((W * H) / 900);
  for(let i = 0; i < count; i++){
    const bx = rnd(0, W), by = rnd(0, H);
    const ci = Math.floor(Math.random() * PAL.length);
    dots.push({
      x:bx, y:by, bx, by, vx:0, vy:0,
      phase:  Math.random()*Math.PI*2,
      phase2: Math.random()*Math.PI*2,
      freq:   2.5+Math.random()*5.0,
      freq2:  1.5+Math.random()*3.5,
      orbitAngle: Math.random()*Math.PI*2,
      orbitR: 15+Math.random()*90,
      orbitSpd: (Math.random()<0.5?1:-1)*(0.018+Math.random()*0.038),
      r:PAL[ci][0], g:PAL[ci][1], b:PAL[ci][2],
      size: 0.4+Math.random()*1.5,
      baseDim:    0.22+Math.random()*0.18,
      sparkleMax: 0.52+Math.random()*0.14,
    });
  }
}

function drawCursor(x, y, str){
  if(str < 0.02) return;
  const a = str;

  // outer ring: 4 clean static arcs
  const outerR = 68 * str;
  const gap = 0.32;
  const arcSpan = Math.PI/2 - gap;
  for(let i = 0; i < 4; i++){
    const start = i * (Math.PI/2) + gap/2;
    ctx.beginPath();
    ctx.arc(x, y, outerR, start, start + arcSpan);
    ctx.strokeStyle = `rgba(244,114,182,${a * 0.4})`;
    ctx.lineWidth = 0.8; ctx.stroke();
  }

  // counter-rotating mid ring with tick marks
  const midR = 50 * str;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-t * 0.65);
  ctx.beginPath();
  ctx.arc(0, 0, midR, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(180,130,255,${a * 0.25})`;
  ctx.lineWidth = 0.8; ctx.stroke();
  for(let i = 0; i < 12; i++){
    const ang = (i/12)*Math.PI*2;
    const isLong = i%3===0;
    const inner = midR-(isLong?7:4);
    ctx.beginPath();
    ctx.moveTo(Math.cos(ang)*inner,    Math.sin(ang)*inner);
    ctx.lineTo(Math.cos(ang)*(midR+1), Math.sin(ang)*(midR+1));
    ctx.strokeStyle = `rgba(220,160,255,${a*(isLong?0.8:0.4)})`;
    ctx.lineWidth = isLong?1.2:0.7; ctx.stroke();
  }
  ctx.restore();

  // 4 corner bracket chevrons
  const bktR = 38 * str;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(t * 0.25);
  for(let i = 0; i < 4; i++){
    const ang = (i/4)*Math.PI*2 + Math.PI/4;
    const bx2 = Math.cos(ang)*bktR, by2 = Math.sin(ang)*bktR;
    ctx.save();
    ctx.translate(bx2, by2);
    ctx.rotate(ang+Math.PI/4);
    ctx.beginPath();
    ctx.moveTo(-5,-2); ctx.lineTo(-5,-5); ctx.lineTo(-2,-5);
    ctx.strokeStyle = `rgba(244,114,182,${a*0.9})`;
    ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  // inner spinning arcs
  for(let i = 0; i < 5; i++){
    const ang = t*0.75 + i*(Math.PI*2/5);
    ctx.beginPath();
    ctx.arc(x, y, 28*str, ang, ang+0.75);
    ctx.strokeStyle = `rgba(220,140,255,${a*0.5})`;
    ctx.lineWidth = 1.2; ctx.stroke();
  }
  for(let i = 0; i < 3; i++){
    const ang = -t*1.1 + i*(Math.PI*2/3);
    ctx.beginPath();
    ctx.arc(x, y, 18*str, ang, ang+1.1);
    ctx.strokeStyle = `rgba(244,114,182,${a*0.4})`;
    ctx.lineWidth = 0.8; ctx.stroke();
  }

  // core glow
  const cg = ctx.createRadialGradient(x, y, 0, x, y, 22*str);
  cg.addColorStop(0, `rgba(244,114,182,${a*0.25})`);
  cg.addColorStop(0.5, `rgba(167,139,250,${a*0.1})`);
  cg.addColorStop(1, 'rgba(167,139,250,0)');
  ctx.beginPath(); ctx.arc(x, y, 22*str, 0, Math.PI*2);
  ctx.fillStyle = cg; ctx.fill();

  // center dot
  ctx.beginPath(); ctx.arc(x, y, 2.5*str, 0, Math.PI*2);
  ctx.fillStyle = `rgba(255,210,255,${a*0.95})`;
  ctx.fill();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  t += 0.016;

  lensStr = mouse.inside
    ? Math.min(1, lensStr+0.045)
    : Math.max(0, lensStr-0.045);

  const lensX = mouse.x, lensY = mouse.y;
  const captureR = 140*lensStr;

  for(const d of dots){
    const raw1    = Math.sin(t*d.freq +d.phase) *0.5+0.5;
    const raw2    = Math.sin(t*d.freq2+d.phase2)*0.5+0.5;
    const sparkle = Math.pow(raw1*raw2, 0.25);

    let boost = 0;
    if(lensStr>0){
      const dx=d.bx-lensX, dy=d.by-lensY;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<captureR){
        boost=Math.pow(1-dist/captureR,1.8)*lensStr;
        const targetR=Math.max(12,dist*0.28+d.orbitR*0.08)*lensStr;
        const toX=lensX+Math.cos(d.orbitAngle)*targetR-d.x;
        const toY=lensY+Math.sin(d.orbitAngle)*targetR-d.y;
        d.vx+=toX*0.09*boost; d.vy+=toY*0.09*boost;
        d.orbitAngle+=d.orbitSpd*lensStr;
      }
    }

    d.vx+=(d.bx-d.x)*0.032; d.vy+=(d.by-d.y)*0.032;
    d.vx*=0.78; d.vy*=0.78;
    d.x+=d.vx; d.y+=d.vy;

    const idleAlpha  = d.baseDim + sparkle*d.sparkleMax;
    const hoverAlpha = d.baseDim + sparkle*d.sparkleMax*0.4 + boost*0.95;
    const alpha = Math.min(1, lerp(idleAlpha, hoverAlpha, lensStr));
    const sz = d.size + sparkle*0.8 + boost*3.2;
    const rc = Math.round(lerp(d.r,255,boost*0.35));
    const gc = Math.round(lerp(d.g,255,boost*0.12));
    const bc = Math.round(lerp(d.b,255,boost*0.35));

    if(sparkle>0.72){
      const ps=(sparkle-0.72)/0.28;
      const gr=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,sz*5);
      gr.addColorStop(0,`rgba(${d.r},${d.g},${d.b},${ps*0.28})`);
      gr.addColorStop(1,`rgba(${d.r},${d.g},${d.b},0)`);
      ctx.beginPath();ctx.arc(d.x,d.y,sz*5,0,Math.PI*2);
      ctx.fillStyle=gr;ctx.fill();
    }
    if(boost>0.28){
      const gr=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,sz*5.5);
      gr.addColorStop(0,`rgba(${rc},${gc},${bc},${boost*0.22})`);
      gr.addColorStop(1,`rgba(${rc},${gc},${bc},0)`);
      ctx.beginPath();ctx.arc(d.x,d.y,sz*5.5,0,Math.PI*2);
      ctx.fillStyle=gr;ctx.fill();
    }
    ctx.beginPath();ctx.arc(d.x,d.y,sz,0,Math.PI*2);
    ctx.fillStyle=`rgba(${rc},${gc},${bc},${alpha})`;
    ctx.fill();
  }

  drawCursor(lensX, lensY, lensStr);
  requestAnimationFrame(draw);
}

card.addEventListener('mousemove',e=>{
  const r=card.getBoundingClientRect();
  mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top;
});
card.addEventListener('mouseenter',()=>mouse.inside=true);
card.addEventListener('mouseleave',()=>{
  mouse.inside=false; mouse.x=-9999; mouse.y=-9999;
});

window.addEventListener('resize',resize);
resize(); draw();
</script>
<script>
/* ===== Screen FX =====
   Reads the card's own canvas (#cv) for the chromatic aberration; everything else is
   independent of the card's drawing code. Glass uses a fixed seed, so it is the same every visit. */
(() => {
  const card = document.getElementById('card');
  const src  = document.getElementById('cv');
  const caCv = document.getElementById('fx-ca'),      caX = caCv.getContext('2d');
  const smCv = document.getElementById('fx-smudge');
  const scCv = document.getElementById('fx-scratch'), scX = scCv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let CW = 1, CH = 1, dpr = 1, scratches = [], micro = new Float32Array(0);

  // ---------- pointer: smoothed, drifts on its own when idle ----------
  let tx = .5, ty = .5, cx = .5, cy = .5, on = 0, present = false, last = 0, mx = -1, my = -1;
  card.addEventListener('pointermove', e => {
    const r = card.getBoundingClientRect();
    mx = e.clientX - r.left; my = e.clientY - r.top;
    tx = mx / r.width; ty = my / r.height; present = true; last = performance.now();
  });
  card.addEventListener('pointerleave', () => { present = false; });

  // each card gets its own glass: seeds come from the page title
  const SEED = [...document.title].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) % 100000, 7);
  const rng = s => { s = (s + SEED) % 2147483646 + 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
  const noise1 = rnd => { const k = Array.from({ length: 12 }, rnd);
    return u => { const x = u * 11, i = Math.floor(x), f = x - i, t = f * f * (3 - 2 * f);
                  return k[i] * (1 - t) + k[Math.min(11, i + 1)] * t; }; };

  function build() {
    CW = Math.max(1, card.offsetWidth); CH = Math.max(1, card.offsetHeight);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    const area = (CW * CH) / (1200 * 675);
    const sc = Math.max(.85, Math.min(1.2, Math.min(CW, CH) / 380));  // marks stay a readable size on small cards

    // ----- smudges -----
    smCv.width = Math.round(CW * dpr); smCv.height = Math.round(CH * dpr);
    const c = smCv.getContext('2d'), rnd = rng(11), W = smCv.width, H = smCv.height, k = dpr * sc;
    c.clearRect(0, 0, W, H);
    const blob = (x, y, rx, ry, rot, a) => {
      c.save(); c.translate(x, y); c.rotate(rot); c.scale(1, ry / rx);
      const g = c.createRadialGradient(0, 0, 0, 0, 0, rx);
      g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(.3, `rgba(255,255,255,${a * .75})`);
      g.addColorStop(.6, `rgba(255,255,255,${a * .3})`); g.addColorStop(.85, `rgba(255,255,255,${a * .08})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, rx, 0, Math.PI * 2); c.fill(); c.restore();
    };
    for (let i = 0; i < Math.max(8, Math.round(40 * area)); i++)
      blob(rnd() * W, rnd() * H, (100 + rnd() * 260) * k, (70 + rnd() * 190) * k, rnd() * Math.PI, .025 + rnd() * .04);
    for (let j = 0; j < Math.max(2, Math.round(7 * area) + 1); j++) {
      let x = rnd() * W, y = rnd() * H, a = rnd() * Math.PI * 2; const turn = (rnd() - .5) * .05;
      for (let i = 0; i < 22; i++) { blob(x, y, (45 + rnd() * 35) * k, (14 + rnd() * 10) * k, a, .03 + rnd() * .03);
        x += Math.cos(a) * 20 * k; y += Math.sin(a) * 20 * k; a += turn; }
    }
    for (let i = 0; i < Math.max(2, Math.round(6 * area)); i++)
      blob(rnd() * W, rnd() * H, (40 + rnd() * 20) * k, (55 + rnd() * 25) * k, rnd() * Math.PI, .06 + rnd() * .04);
    for (let i = 0; i < Math.max(12, Math.round(60 * area)); i++) {
      const d = (2.5 + rnd() * 3.5) * dpr; blob(rnd() * W, rnd() * H, d, d, 0, .14 + rnd() * .16); }

    // ----- scratches (geometry; lit per frame) -----
    scCv.width = Math.round(CW * dpr); scCv.height = Math.round(CH * dpr);
    const R = rng(29); scratches = [];
    const make = (x, y, ang, len, curve, depth, width) => {
      const n = Math.max(3, Math.round(len / 6)), nz = noise1(R), pts = [];
      let a = ang, px = x, py = y;
      for (let i = 0; i <= n; i++) {
        const u = i / n, taper = Math.pow(Math.sin(Math.PI * u), .6);
        let d = depth * taper * (.35 + .65 * nz(u)); if (nz(1 - u) < .22) d *= .08;
        pts.push(px, py, d); a += curve / n; px += Math.cos(a) * len / n; py += Math.sin(a) * len / n;
      }
      scratches.push({ pts, width, minX: Math.min(x, px) - 10, maxX: Math.max(x, px) + 10,
                       minY: Math.min(y, py) - 10, maxY: Math.max(y, py) + 10 });
    };
    for (let j = 0; j < Math.max(3, Math.round(14 * area) + 1); j++) {
      const ox = R() * CW, oy = R() * CH, base = R() * Math.PI, curve = (R() - .5) * .9;
      const count = 20 + Math.round(R() * 34);
      for (let i = 0; i < count; i++) {
        const off = (R() - .5) * 90 * sc;
        make(ox + Math.cos(base + Math.PI / 2) * off + (R() - .5) * 60 * sc,
             oy + Math.sin(base + Math.PI / 2) * off + (R() - .5) * 60 * sc,
             base + (R() - .5) * .12, (30 + R() * 190) * sc, curve + (R() - .5) * .15, .35 + R() * .5, .45 + R() * .3);
      }
    }
    for (let i = 0; i < Math.max(2, Math.round(10 * area)); i++)
      make(R() * CW, R() * CH, R() * Math.PI * 2, (160 + R() * 420) * sc, (R() - .5) * .6, .7 + R() * .3, .7 + R() * .5);
    for (let i = 0; i < Math.max(150, Math.round(700 * area)); i++)
      make(R() * CW, R() * CH, R() * Math.PI * 2, 4 + R() * 22, (R() - .5) * .4, .25 + R() * .45, .4 + R() * .25);
    const M = rng(53), nMicro = Math.max(700, Math.round(3200 * area));
    micro = new Float32Array(nMicro * 5);
    const patches = Array.from({ length: 6 }, () => [M() * CW, M() * CH, (60 + M() * 120) * sc]);
    for (let i = 0; i < nMicro; i++) {
      let x, y;
      if (M() < .4) { const [px, py, pr] = patches[Math.floor(M() * 6)]; const a = M() * Math.PI * 2, d = pr * Math.sqrt(M());
                       x = px + Math.cos(a) * d; y = py + Math.sin(a) * d; }
      else { x = M() * CW; y = M() * CH; }
      const a = M() * Math.PI * 2, len = (1.5 + M() * 4.5) * Math.max(1, sc * 1.3);
      micro.set([x, y, x + Math.cos(a) * len, y + Math.sin(a) * len, .45 + M() * .55], i * 5);
    }

    // ----- aberration canvas -----
    caCv.width = Math.round(CW * dpr); caCv.height = Math.round(CH * dpr);
  }

  // ---------- chromatic aberration: copy the card canvas around the cursor, split red/blue ----------
  const tmp = document.createElement('canvas'), tX = tmp.getContext('2d');
  function aberration() {
    caX.setTransform(1, 0, 0, 1, 0, 0);
    caX.clearRect(0, 0, caCv.width, caCv.height);
    if (on < .01 || mx < 0) return;
    const R = Math.round(Math.min(CW, CH) * .34), E = .018 * on;
    const S = Math.round(R * 2 * dpr);
    if (tmp.width !== S) { tmp.width = tmp.height = S; }
    const k = src.width / CW;                                       // card canvas pixels per CSS px
    const pass = (col, scale) => {
      // draw the card canvas scaled about the cursor into tmp, keep one colour channel
      tX.globalCompositeOperation = 'source-over'; tX.clearRect(0, 0, S, S);
      const sw = (R * 2) / scale;                                    // source size in CSS px
      const drawSrc = () => tX.drawImage(src, (mx - sw / 2) * k, (my - sw / 2) * k, sw * k, sw * k, 0, 0, S, S);
      drawSrc();
      tX.globalCompositeOperation = 'multiply'; tX.fillStyle = col; tX.fillRect(0, 0, S, S);
      tX.globalCompositeOperation = 'destination-in'; drawSrc();
      caX.globalCompositeOperation = 'lighter';
      caX.drawImage(tmp, (mx - R) * dpr, (my - R) * dpr);
    };
    pass('rgb(255,40,60)', 1 + E);
    pass('rgb(40,90,255)', 1 - E);
    // soft disc, faded out right under the cursor (lens centre)
    caX.globalCompositeOperation = 'destination-in';
    const g = caX.createRadialGradient(mx * dpr, my * dpr, 0, mx * dpr, my * dpr, R * dpr);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.25, 'rgba(0,0,0,.6)');
    g.addColorStop(.6, 'rgba(0,0,0,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    caX.fillStyle = g; caX.fillRect(0, 0, caCv.width, caCv.height);
    caX.globalCompositeOperation = 'source-over';
  }

  // ---------- rainbow light leak: a soft spectral band through the cursor ----------
  const lkCv = document.getElementById('fx-leak'), lkX = lkCv.getContext('2d');
  const LK_SCALE = .5, LK_SLICES = 24, LK_WIDTH = .45, LK_FAN = .35;
  const spectral = nm => {
    let r = 0, g = 0, b = 0;
    if (nm < 440) { r = -(nm - 440) / 60; b = 1; } else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
    else if (nm < 510) { g = 1; b = -(nm - 510) / 20; } else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
    else if (nm < 645) { r = 1; g = -(nm - 645) / 65; } else { r = 1; }
    const edge = nm < 420 ? .4 + .6 * (nm - 380) / 40 : nm > 700 ? .4 + .6 * (750 - nm) / 50 : 1;
    const lum = .6 + .4 * Math.exp(-Math.pow((nm - 565) / 90, 2));
    return [r, g, b].map(v => Math.round(255 * Math.pow(Math.max(0, v * edge * lum), .8)));
  };
  // each colour trails the cursor at its own speed, so quick moves smear the band apart
  const lkSlices = Array.from({ length: LK_SLICES }, (_, i) => {
    const t = i / (LK_SLICES - 1); return { t, rgb: spectral(700 - t * 300), k: .16 - .1 * t, x: .5, y: .5 }; });
  let lkRot = -.5, lkPx = .5, lkPy = .5;
  function leakFrame(s) {
    const W = lkCv.width = Math.max(1, Math.round(CW * LK_SCALE)), H = lkCv.height = Math.max(1, Math.round(CH * LK_SCALE));
    for (const sl of lkSlices) { const k = reduce ? 1 : sl.k; sl.x += (tx - sl.x) * k; sl.y += (ty - sl.y) * k; }
    const vx = (cx - lkPx) * CW, vy = (cy - lkPy) * CH; lkPx = cx; lkPy = cy;
    const target = -.55 + Math.sin(s * .07) * .25 + (cx - .5) * .6 + Math.max(-.3, Math.min(.3, (vy - vx * .4) * .03));
    lkRot += (target - lkRot) * .05;
    const band = Math.min(W, H) * LK_WIDTH * (1 + Math.sin(s * .5) * .08);
    const len = Math.hypot(W, H) * 1.3, step = band / LK_SLICES, gain = .8 + .2 * on;
    lkX.clearRect(0, 0, W, H);
    lkX.globalCompositeOperation = 'lighter';
    for (const sl of lkSlices) {
      const [r, g, b] = sl.rgb, off = (sl.t - .5) * band;
      lkX.save(); lkX.translate(sl.x * W, sl.y * H); lkX.rotate(lkRot);
      const grad = lkX.createLinearGradient(-len / 2, 0, len / 2, 0);
      grad.addColorStop(0, `rgba(${r},${g},${b},0)`); grad.addColorStop(.35, `rgba(${r},${g},${b},${.18 * gain})`);
      grad.addColorStop(.5, `rgba(${r},${g},${b},${.32 * gain})`); grad.addColorStop(.65, `rgba(${r},${g},${b},${.18 * gain})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      lkX.fillStyle = grad;
      const th = step * 2.4, spread = off * LK_FAN;
      lkX.beginPath();
      lkX.moveTo(-len / 2, off - spread - th / 2); lkX.lineTo(0, off - th / 2); lkX.lineTo(len / 2, off + spread - th / 2);
      lkX.lineTo(len / 2, off + spread + th / 2); lkX.lineTo(0, off + th / 2); lkX.lineTo(-len / 2, off - spread + th / 2);
      lkX.closePath(); lkX.fill(); lkX.restore();
    }
    lkX.globalCompositeOperation = 'source-over';
  }

  // ---------- scratches lit by the glare ----------
  const LEVELS = 16;
  const paths = Array.from({ length: LEVELS }, () => []), microPaths = Array.from({ length: LEVELS }, () => []);
  function scratchesFrame(lx, ly) {
    const reach = Math.min(CW, CH) * .6, gain = .28 + .72 * on;
    scX.setTransform(dpr, 0, 0, dpr, 0, 0); scX.clearRect(0, 0, CW, CH);
    for (const p of paths) p.length = 0; for (const p of microPaths) p.length = 0;
    const r2 = reach * 1.6;
    for (const s of scratches) {
      if (s.maxX < lx - r2 || s.minX > lx + r2 || s.maxY < ly - r2 || s.minY > ly + r2) continue;
      const P = s.pts;
      for (let i = 0; i < P.length - 3; i += 3) {
        const x0 = P[i], y0 = P[i + 1], x1 = P[i + 3], y1 = P[i + 4], depth = (P[i + 2] + P[i + 5]) * .5;
        if (depth < .02) continue;
        const dx = (x0 + x1) * .5 - lx, dy = (y0 + y1) * .5 - ly, dist = Math.hypot(dx, dy) || 1;
        const fall = Math.exp(-(dist / reach) * (dist / reach)); if (fall < .02) continue;
        let ux = x1 - x0, uy = y1 - y0; const tl = Math.hypot(ux, uy) || 1;
        const cos = (ux * dx + uy * dy) / (tl * dist), spec = Math.exp(-(cos * cos) / .06);
        const b = Math.min(1, depth * fall * (.05 + .95 * spec) * gain * 1.0);
        const lvl = Math.min(LEVELS - 1, Math.round(b * (LEVELS - 1))); if (lvl < 1) continue;
        paths[lvl].push(x0, y0, x1, y1, s.width);
      }
    }
    for (let i = 0; i < micro.length; i += 5) {
      const x0 = micro[i], y0 = micro[i + 1], dx = x0 - lx, dy = y0 - ly;
      if (dx > r2 || dx < -r2 || dy > r2 || dy < -r2) continue;
      const dist = Math.hypot(dx, dy) || 1, fall = Math.exp(-(dist / reach) * (dist / reach)); if (fall < .03) continue;
      const ux = micro[i + 2] - x0, uy = micro[i + 3] - y0, tl = Math.hypot(ux, uy) || 1;
      const cos = (ux * dx + uy * dy) / (tl * dist), spec = Math.exp(-(cos * cos) / .015);
      const b = Math.min(1, micro[i + 4] * fall * spec * gain * 1.6);
      const lvl = Math.min(LEVELS - 1, Math.round(b * (LEVELS - 1))); if (lvl < 1) continue;
      microPaths[lvl].push(x0, y0, micro[i + 2], micro[i + 3]);
    }
    scX.lineCap = 'round'; scX.lineWidth = .35;
    for (let l = 1; l < LEVELS; l++) { const p = microPaths[l]; if (!p.length) continue;
      scX.strokeStyle = `rgba(255,255,255,${(l / LEVELS).toFixed(3)})`; scX.beginPath();
      for (let i = 0; i < p.length; i += 4) { scX.moveTo(p[i], p[i + 1]); scX.lineTo(p[i + 2], p[i + 3]); }
      scX.stroke(); }
    for (let l = 1; l < LEVELS; l++) { const p = paths[l]; if (!p.length) continue;
      scX.strokeStyle = `rgba(236,242,255,${(l / LEVELS).toFixed(3)})`;
      for (const wide of [false, true]) { scX.lineWidth = wide ? .95 : .55; scX.beginPath();
        for (let i = 0; i < p.length; i += 5) { if ((p[i + 4] > .75) !== wide) continue;
          scX.moveTo(p[i], p[i + 1]); scX.lineTo(p[i + 2], p[i + 3]); }
        scX.stroke(); } }
  }

  function frame(now) {
    const s = now / 1000, idle = !present || now - last > 4000;
    if (idle) { tx = .5 + Math.sin(s * .21) * .28; ty = .45 + Math.cos(s * .16) * .22; }
    on += ((idle ? 0 : 1) - on) * .06;
    const kk = reduce ? 1 : .12; cx += (tx - cx) * kk; cy += (ty - cy) * kk;
    // glare sits up-left of the cursor, as if lit from above, so the effect under the cursor stays clear
    const gx = cx - .07, gy = cy - .13;
    card.style.setProperty('--gx', (gx * 100).toFixed(2) + '%');
    card.style.setProperty('--gy', (gy * 100).toFixed(2) + '%');
    card.style.setProperty('--g-on', on.toFixed(3));
    leakFrame(s);
    scratchesFrame(gx * CW, gy * CH);
    aberration();
    requestAnimationFrame(frame);
  }

  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 150); });
  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
